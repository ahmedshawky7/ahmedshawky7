name: Generate CV PDFs

on:
  push:
    branches: [main, master]
    paths:
      - "data/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/generate-cvs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cvs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate LaTeX sources
        run: python scripts/generate_cvs.py

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Compile PDFs
        run: |
          set -e
          for file in output/*.tex; do
            latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=output "$file"
          done

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Ahmed-Shawky-CVs
          path: output/*.pdf
          if-no-files-found: error

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.pdf
          if ! git diff --cached --quiet; then
            git commit -m "chore: update generated CV PDFs"
            git push
          fi
